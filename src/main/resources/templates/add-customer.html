<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Customer - Inventra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 shadow-sm">
    <a class="navbar-brand fw-bold fs-4" href="/">🛒 Inventra</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/products">📦 Inventory</a></li>
            <li class="nav-item"><a class="nav-link active" href="/customers">📒 Khata</a></li>
            <li class="nav-item"><a class="nav-link" href="/pos">🧾 Billing (POS)</a></li>
        </ul>
    </div>
</nav>

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-success mb-0">👤 Register Customer</h3>
            <a href="/customers" class="btn btn-sm btn-outline-secondary">← Back to Directory</a>
        </div>

        <form th:action="@{/customers/add}" th:object="${customer}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Customer Full Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Ramesh Kumar" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mobile Phone Number</label>
                <input type="tel" th:field="*{phone}" class="form-control" placeholder="e.g. 9876543210" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Opening Udhar Debt (₹) <small class="text-muted">(Optional)</small></label>
                <input type="number" step="1" th:field="*{creditBalance}" class="form-control" placeholder="0">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">💾 Register Customer</button>
        </form>
    </div>
</div>

</body>
</html>
