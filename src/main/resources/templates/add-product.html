<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product - Inventra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 shadow-sm">
        <a class="navbar-brand fw-bold fs-4" href="/">🛒 Inventra</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/products">📦 Inventory</a></li>
                <li class="nav-item"><a class="nav-link" href="/customers">📒 Khata</a></li>
                <li class="nav-item"><a class="nav-link" href="/pos">🧾 Billing (POS)</a></li>
            </ul>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold text-primary mb-0">➕ Add New Product</h3>
                <a href="/products" class="btn btn-sm btn-outline-secondary">← Back to Inventory</a>
            </div>

            <form th:action="@{/products/add}" th:object="${product}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Product Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Aashirvaad Atta 5kg" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Selling Price (₹)</label>
                        <input type="number" step="0.5" th:field="*{price}" class="form-control" placeholder="e.g. 250" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Stock Quantity</label>
                        <input type="number" th:field="*{stockQuantity}" class="form-control" placeholder="e.g. 20" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Expiry Date</label>
                    <input type="date" th:field="*{expiryDate}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">💾 Save Product</button>
            </form>
        </div>
    </div>

</body>
</html>
