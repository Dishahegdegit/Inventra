<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Inventra</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Theme -->
    <link rel="stylesheet" th:href="@{/css/inventoory-theme.css}">
</head>
<body>

    <!-- Top Navbar -->
    <header class="inventoory-header">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="/" class="brand-logo">
                <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
                <span>inventra</span>
            </a>
            <nav class="nav-pill-group">
                <a href="/" class="nav-pill-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="/products" class="nav-pill-link active"><i class="bi bi-bag-check-fill"></i> Inventory</a>
                <a href="/pos" class="nav-pill-link"><i class="bi bi-cart3"></i> Sales (POS)</a>
                <a href="/customers" class="nav-pill-link"><i class="bi bi-journal-bookmark"></i> Khata</a>
            </nav>
            <div></div>
        </div>
    </header>

    <div class="container py-5" style="max-width: 650px;">
        <div class="filter-panel p-4 shadow-lg">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-white mb-1"><i class="bi bi-plus-circle-fill me-2" style="color: var(--neon-mint);"></i> New Catalog Item</h3>
                    <p class="text-secondary small mb-0">Register a new product with pricing, category, and image</p>
                </div>
                <a href="/products" class="btn btn-sm btn-outline-secondary rounded-pill px-3">← Back</a>
            </div>

            <form th:action="@{/products/add}" th:object="${product}" method="post">
                
                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">PRODUCT NAME</label>
                    <input type="text" th:field="*{name}" class="inventoory-search ps-3" placeholder="e.g. Amul Taaza Toned Milk 500ml" required>
                </div>

                <!-- Category & SKU -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">CATEGORY</label>
                        <select th:field="*{category}" class="form-select filter-select">
                            <option value="Dairy">Dairy & Cold</option>
                            <option value="Grains & Flour">Grains & Flour</option>
                            <option value="Snacks">Snacks & Confectionery</option>
                            <option value="Cooking & Oils">Cooking & Oils</option>
                            <option value="Beverages">Beverages & Coffee</option>
                            <option value="Household">Household & Hygiene</option>
                            <option value="General">General Grocery</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">SKU / BARCODE</label>
                        <input type="text" th:field="*{sku}" class="inventoory-search ps-3" placeholder="e.g. SKU-MLK-0012">
                    </div>
                </div>

                <!-- Retail Price & Purchase Cost -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">SELLING RETAIL PRICE (₹)</label>
                        <input type="number" step="0.5" th:field="*{price}" class="inventoory-search ps-3" placeholder="32.0" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">PURCHASE COST (₹)</label>
                        <input type="number" step="0.5" th:field="*{purchasePrice}" class="inventoory-search ps-3" placeholder="26.0">
                    </div>
                </div>

                <!-- Stock Quantity & Expiry Date -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">INITIAL STOCK QUANTITY</label>
                        <input type="number" th:field="*{stockQuantity}" class="inventoory-search ps-3" placeholder="20" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">EXPIRY DATE</label>
                        <input type="date" th:field="*{expiryDate}" class="inventoory-search ps-3" required>
                    </div>
                </div>

                <!-- Product Photo URL -->
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">PRODUCT IMAGE WEB URL (OPTIONAL)</label>
                    <input type="url" th:field="*{imageUrl}" class="inventoory-search ps-3" placeholder="https://images.unsplash.com/... (or leave blank for auto-image)">
                </div>

                <button type="submit" class="btn w-100 py-3 fw-bold rounded-pill" style="background: var(--neon-mint); color: #0b1013;">
                    <i class="bi bi-check2-circle me-1"></i> Save Product to Catalog
                </button>
            </form>
        </div>
    </div>

</body>
</html>
