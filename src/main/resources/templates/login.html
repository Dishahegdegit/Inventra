<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Inventra Retail Terminal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Theme -->
    <link rel="stylesheet" th:href="@{/css/inventoory-theme.css}">
    <style>
        .login-box {
            background: var(--card-surface);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 460px;
            width: 100%;
        }
        .demo-chip {
            background: #141c20;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .demo-chip:hover {
            border-color: var(--neon-mint);
            background: #192429;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="login-box">
        
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center gap-2 mb-2">
                <div class="brand-icon" style="width: 36px; height: 36px; font-size: 20px;">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
                <span class="fs-3 fw-bold text-white">inventra</span>
            </div>
            <p class="text-secondary small mb-0">Role-Based Retail POS & Inventory Terminal</p>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${param.error}" class="alert alert-danger py-2 px-3 small border-0 mb-3" style="background: rgba(255, 71, 87, 0.2); color: #ff6b81;">
            <i class="bi bi-exclamation-octagon-fill me-1"></i> Invalid username or password. Please try again.
        </div>

        <div th:if="${param.logout}" class="alert alert-success py-2 px-3 small border-0 mb-3" style="background: rgba(0, 220, 130, 0.15); color: var(--neon-mint);">
            <i class="bi bi-check-circle-fill me-1"></i> You have logged out successfully.
        </div>

        <!-- 1-Click Demo Login Selector for Viva/Presentations -->
        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold mb-2">1-CLICK DEMO CREDENTIALS</label>
            <div class="d-flex flex-column gap-2">
                <button type="button" class="demo-chip" onclick="fillCredentials('admin', 'admin123')">
                    <div>
                        <div class="fw-bold text-white small">👑 Store Owner (Admin)</div>
                        <div class="text-secondary" style="font-size: 11px;">Full access • Analytics, Stock & Settings</div>
                    </div>
                    <span class="badge" style="background: rgba(0, 220, 130, 0.15); color: var(--neon-mint);">admin</span>
                </button>

                <button type="button" class="demo-chip" onclick="fillCredentials('cashier', 'cashier123')">
                    <div>
                        <div class="fw-bold text-white small">🧑‍💼 Cashier (Staff)</div>
                        <div class="text-secondary" style="font-size: 11px;">Fast POS Billing Lane • Cannot delete stock</div>
                    </div>
                    <span class="badge" style="background: rgba(55, 66, 250, 0.15); color: #70a1ff;">cashier</span>
                </button>
            </div>
        </div>

        <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1" style="border-color: var(--card-border);">
            <span class="px-3 text-secondary small">or enter manually</span>
            <hr class="flex-grow-1" style="border-color: var(--card-border);">
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">USERNAME</label>
                <div class="position-relative">
                    <i class="bi bi-person position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                    <input type="text" name="username" id="usernameInput" class="inventoory-search" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">PASSWORD</label>
                <div class="position-relative">
                    <i class="bi bi-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                    <input type="password" name="password" id="passwordInput" class="inventoory-search" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn w-100 py-3 fw-bold rounded-pill shadow" style="background: var(--neon-mint); color: #0b1013;">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Terminal
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-secondary" style="font-size: 11px;">Powered by Spring Security 6 & Inventra Enterprise</small>
        </div>

    </div>

    <script>
        function fillCredentials(user, pass) {
            document.getElementById('usernameInput').value = user;
            document.getElementById('passwordInput').value = pass;
        }
    </script>

</body>
</html>
